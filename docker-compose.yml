version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - ./env/.env
    networks:
      - app-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file:
      - ./env/.env
    depends_on:
      - api
    environment:
      - API_BASE=http://api:8000
    networks:
      - app-network

networks:
  app-network:
    driver: bridge